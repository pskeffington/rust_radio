[package]
name = "rust-radio-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"

[features]
default = []
receivers = ["nrsp-native", "soapy-sdr"]
nrsp-native = ["rust-radio-audio/nrsp-native"]
sdrconnect = ["rust-radio-audio/sdrconnect"]
soapy-sdr = ["rust-radio-core/sdr", "rust-radio-audio/soapy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rust-radio-core = { path = "../rust-radio-core" }
rust-radio-audio = { path = "../rust-radio-audio" }
rust-radio-ip = { path = "../rust-radio-ip" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[lib]
name = "rust_radio_gui"
path = "src/lib.rs"

[[bin]]
name = "rust-radio-gui"
path = "src/main.rs"
