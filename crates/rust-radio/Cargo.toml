[package]
name = "rust-radio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Standalone, embeddable receive-only radio module for Rust hosts"

[features]
default = ["ip-radio"]
ip-radio = ["dep:rust-radio-audio", "dep:rust-radio-ip"]
sdr = ["rust-radio-core/sdr", "dep:rust-radio-sdr"]
soapy-sdr = ["sdr", "rust-radio-sdr/soapy"]
sdrconnect = ["sdr", "rust-radio-sdr/sdrconnect", "rust-radio-audio?/sdrconnect"]
gui = ["ip-radio", "dep:rust-radio-gui"]

[dependencies]
rust-radio-core = { path = "../rust-radio-core" }
rust-radio-audio = { path = "../rust-radio-audio", optional = true }
rust-radio-ip = { path = "../rust-radio-ip", optional = true }
rust-radio-gui = { path = "../rust-radio-gui", optional = true }
rust-radio-sdr = { path = "../rust-radio-sdr", optional = true }
