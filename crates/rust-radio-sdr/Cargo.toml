[package]
name = "rust-radio-sdr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded receive-only SDR capture and optional SoapySDR adapter"

[features]
default = []
soapy = ["dep:soapysdr", "dep:num-complex"]

[dependencies]
rust-radio-core = { path = "../rust-radio-core", features = ["sdr"] }
soapysdr = { version = "=0.5.1", default-features = false, optional = true }
num-complex = { version = "=0.4.6", optional = true }
