[package]
name = "rust-radio-sdr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded receive-only SDR capture and optional SoapySDR adapter"

[features]
default = []
soapy = ["dep:soapysdr", "dep:num-complex"]
nrsp-native = ["dep:tungstenite", "dep:if-addrs"]
sdrconnect = ["dep:tungstenite", "dep:serde", "dep:serde_json"]

[dependencies]
rust-radio-core = { path = "../rust-radio-core", features = ["sdr"] }
soapysdr = { version = "=0.5.1", default-features = false, optional = true }
if-addrs = { version = "=0.15.0", optional = true }
num-complex = { version = "=0.4.6", optional = true }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
