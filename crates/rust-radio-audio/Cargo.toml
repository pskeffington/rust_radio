[package]
name = "rust-radio-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
nrsp-native = ["dep:rust-radio-sdr", "rust-radio-sdr/nrsp-native", "dep:opus"]
sdrconnect = ["dep:rust-radio-sdr", "rust-radio-sdr/sdrconnect"]
soapy = ["dep:rust-radio-sdr", "rust-radio-sdr/soapy"]

[dependencies]
rust-radio-core = { path = "../rust-radio-core" }
rust-radio-ip = { path = "../rust-radio-ip" }
rust-radio-sdr = { path = "../rust-radio-sdr", optional = true }
cpal = "=0.16.0"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "aac"] }
ringbuf = "=0.4.8"
opus = { version = "=0.4.0", optional = true }
