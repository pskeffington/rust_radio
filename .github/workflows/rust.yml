name: Rust radio core
on:
  push:
    branches: [main]
  pull_request:
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux native audio headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test offline core
        run: cargo test --workspace
      - name: Test optional native network receiver without hardware
        run: cargo test --workspace --locked --features rust-radio-cli/sdrconnect
      - name: Lint optional native network receiver
        run: cargo clippy --workspace --all-targets --locked --features rust-radio-cli/sdrconnect -- -D warnings
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
  sdrconnect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - name: Test network API using local fixtures only
        run: cargo test --locked -p rust-radio-sdr --features sdrconnect
      - name: Lint network API
        run: cargo clippy --locked -p rust-radio-sdr --all-targets --features sdrconnect -- -D warnings
      - name: Check embedded module without native SDK or audio
        run: cargo check --locked -p rust-radio --no-default-features --features sdrconnect
      - name: Cross-check headless receiver module for Raspberry Pi ARM64
        run: cargo check --locked -p rust-radio --no-default-features --features sdrconnect --target aarch64-unknown-linux-gnu
  native-nrsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native audio and Opus build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-linux-gnu
      - name: Test native receiver, audio and GUI without hardware
        run: cargo test --workspace --locked --features rust-radio-cli/nrsp-native,rust-radio-gui/nrsp-native
      - name: Lint native receiver, audio and GUI
        run: cargo clippy --workspace --all-targets --locked --features rust-radio-cli/nrsp-native,rust-radio-gui/nrsp-native -- -D warnings
      - name: Cross-check headless direct receiver for Raspberry Pi ARM64
        run: cargo check --locked -p rust-radio --no-default-features --features nrsp-native --target aarch64-unknown-linux-gnu
  optional-sdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install receive adapter SDK headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsoapysdr-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test receive adapter without opening devices
        run: cargo test --locked -p rust-radio-sdr --features soapy
      - name: Lint receive adapter
        run: cargo clippy --locked -p rust-radio-sdr --all-targets --features soapy -- -D warnings
      - name: Check hardware-only embedded module
        run: cargo check --locked -p rust-radio --no-default-features --features soapy-sdr

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the default workspace on Windows MSVC
        run: cargo check --workspace --locked
      - name: Lint the default workspace on Windows MSVC
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the default workspace on Windows MSVC
        run: cargo test --workspace --locked
      - name: Check the optional SDRconnect receiver on Windows MSVC
        run: cargo check --workspace --locked --features rust-radio-cli/sdrconnect
      - name: Lint the optional SDRconnect receiver on Windows MSVC
        run: cargo clippy --workspace --all-targets --locked --features rust-radio-cli/sdrconnect -- -D warnings
      - name: Test the optional SDRconnect receiver on Windows MSVC
        run: cargo test --workspace --locked --features rust-radio-cli/sdrconnect
      - name: Check the direct nRSP receiver and GUI on Windows MSVC
        run: cargo check --workspace --locked --features rust-radio-cli/nrsp-native,rust-radio-gui/nrsp-native
      - name: Lint the direct nRSP receiver and GUI on Windows MSVC
        run: cargo clippy --workspace --all-targets --locked --features rust-radio-cli/nrsp-native,rust-radio-gui/nrsp-native -- -D warnings
      - name: Test the direct nRSP receiver and GUI on Windows MSVC
        run: cargo test --workspace --locked --features rust-radio-cli/nrsp-native,rust-radio-gui/nrsp-native
